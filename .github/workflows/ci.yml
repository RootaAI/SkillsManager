name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run Core tests
        run: dotnet test SkillsManager.Core.Tests -c Release

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build solution (Release, warnings as errors)
        run: dotnet build SkillsManager.sln -c Release -warnaserror

      - name: Run Core tests
        run: dotnet test SkillsManager.Core.Tests -c Release --no-build
